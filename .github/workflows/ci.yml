name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is committed. Remove it and use .env.example."
            exit 1
          fi
          echo "No .env files committed."

  clip-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint (real errors only for now)
        run: |
          pip install ruff
          # Minimal ruleset: syntax errors + undefined names. Tighten as the code grows.
          ruff check --select E9,F63,F7,F82 clip-service

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck (once the app is scaffolded)
        run: |
          if [ -f app/package.json ]; then
            cd app
            npm ci
            npx tsc --noEmit
          else
            echo "app/package.json not present yet; skipping typecheck."
          fi
