<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" />
    <title>ClipMind offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0d1117;
        color: #f5f7fb;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 420px;
      }

      h1 {
        font-size: 1.7rem;
        line-height: 1.1;
        margin: 0 0 12px;
      }

      p {
        color: #b8c0cc;
        font-size: 1rem;
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Reconnect to open your private ClipMind workspace.</p>
    </main>
  </body>
</html>
